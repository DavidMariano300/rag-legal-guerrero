networks:
  rag_internal:
    driver: bridge

volumes:
  ollama_data:
  qdrant_data:
  postgres_data:
  piper_models:

services:
  ollama:
    image: ollama/ollama:0.3.14
    container_name: rag_ollama
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - rag_internal
    mem_limit: 6g
    restart: unless-stopped
    # Puerto expuesto al host SOLO para depuración del spike local (remapeado a 11435
    # porque el host ya tiene una instalación nativa de Ollama usando el 11434).
    # En producción (Oracle Cloud) este servicio debe permanecer en red interna.
    ports:
      - "11435:11434"

  qdrant:
    image: qdrant/qdrant:v1.11.3
    container_name: rag_qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - rag_internal
    mem_limit: 2g
    restart: unless-stopped
    # Igual que ollama: solo para depuración local del spike.
    ports:
      - "6333:6333"

  postgres:
    image: postgres:16-alpine
    container_name: rag_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rag_internal
    mem_limit: 512m
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rag_backend
    depends_on:
      - ollama
      - qdrant
      - postgres
    environment:
      OLLAMA_HOST: http://ollama:11434
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      WHISPER_MODEL_SIZE: ${WHISPER_MODEL_SIZE:-small}
    # Sin puerto publicado al host: ahora solo es alcanzable vía el proxy (/api/*),
    # conforme al principio de "un único punto de entrada" de security_checklist.md §1.3.
    # Para depurar el backend directamente en local, descomenta:
    # ports:
    #   - "8000:8000"
    volumes:
      - piper_models:/app/models/piper
    networks:
      - rag_internal
    # Subido de 1g a 3g: ahora el backend también carga el modelo de embeddings, el
    # modelo de Whisper (STT) y ejecuta Piper (TTS) en el mismo contenedor. Pendiente
    # de medir el uso real en la VM de Oracle Cloud (ver arquitectura.md §2.2).
    mem_limit: 3g
    restart: unless-stopped

  proxy:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: rag_proxy
    depends_on:
      - backend
    ports:
      - "8080:80"
    networks:
      - rag_internal
    mem_limit: 256m
    restart: unless-stopped
