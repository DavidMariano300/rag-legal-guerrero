networks:
  rag_internal:
    driver: bridge

volumes:
  ollama_data:
  qdrant_data:
  postgres_data:
  piper_models:

services:
  ollama:
    # 0.3.14 → 0.40.11 (2026-10-26): la versión anterior no carga Qwen3.5 (docs/investigacion_llm.md §7).
    image: ollama/ollama:0.40.11
    container_name: rag_ollama
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - rag_internal
    mem_limit: 6g
    restart: unless-stopped
    environment:
      # Por defecto Ollama descarga el modelo tras 5 min sin uso y la siguiente consulta paga la recarga.
      OLLAMA_KEEP_ALIVE: "24h"
    # Puerto expuesto SOLO en loopback para depuración local (remapeado a 11435 porque el host ya
    # tiene un Ollama nativo en el 11434); en 0.0.0.0 cualquiera en la misma red lo podía usar.
    # En producción (Oracle Cloud) este servicio debe permanecer en red interna.
    ports:
      - "127.0.0.1:11435:11434"

  qdrant:
    image: qdrant/qdrant:v1.11.3
    container_name: rag_qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - rag_internal
    mem_limit: 2g
    restart: unless-stopped
    # Igual que ollama: solo loopback, para depuración local (Qdrant no tiene autenticación).
    ports:
      - "127.0.0.1:6333:6333"

  postgres:
    image: postgres:16-alpine
    container_name: rag_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rag_internal
    mem_limit: 512m
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:  # lo que se hornea en la imagen debe coincidir con lo que se usa (HF_HUB_OFFLINE=1)
        EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
        WHISPER_MODEL_SIZE: ${WHISPER_MODEL_SIZE:-small}
    container_name: rag_backend
    depends_on:
      - ollama
      - qdrant
      - postgres
    environment:
      OLLAMA_HOST: http://ollama:11434
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      # qwen3.5:4b desde 2026-10-26: 73 % de respuestas correctas contra 52 % de qwen2.5:7b, y 1.5–2.5 veces
      # más rápido en CPU (docs/investigacion_llm.md §7). Sin "pensamiento": en CPU es demasiado lento.
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:4b}
      OLLAMA_THINK: ${OLLAMA_THINK:-false}
      # bge-m3 desde 2026-10-26 (docs/refactorizacion_rag.md §10): 17/30 respuestas correctas contra 9/30
      # de multilingual-e5-small. Cada modelo tiene su colección; la de e5-small (legal_corpus_test)
      # queda de respaldo: para regresar, cambiar las cuatro variables juntas.
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-legal_corpus_bge_m3}
      QDRANT_SESSION_COLLECTION: ${QDRANT_SESSION_COLLECTION:-session_documents_bge_m3}
      TOP_K_VECTOR: ${TOP_K_VECTOR:-5}
      # El modelo de embeddings viene horneado en la imagen (backend/Dockerfile): sin esto, cada arranque
      # consultaba huggingface.co y fallaba sin red.
      HF_HUB_OFFLINE: "1"
      WHISPER_MODEL_SIZE: ${WHISPER_MODEL_SIZE:-small}
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      PERMITIR_INVITADOS: ${PERMITIR_INVITADOS:-true}
    # Sin puerto publicado al host: ahora solo es alcanzable vía el proxy (/api/*),
    # conforme al principio de "un único punto de entrada" de security_checklist.md §1.3.
    # Para depurar el backend directamente en local, descomenta:
    # ports:
    #   - "8000:8000"
    volumes:
      - piper_models:/app/models/piper
    networks:
      - rag_internal
    # 3g → 5g (2026-10-26): bge-m3 ocupa ~2.3 GB en fp32 (e5-small ~0.5 GB), además de Whisper, Piper y el
    # índice BM25 de ~22,800 fragmentos. En la VM de 12 GB hay que revisar el reparto (arquitectura.md §2.2).
    mem_limit: 5g
    restart: unless-stopped

  tunel:
    # Link público https://<palabras>.trycloudflare.com para la demo con el cliente: sin cuenta y sin costo
    # (Cloudflare "quick tunnel"). Solo se levanta con el perfil demo:
    #   docker compose --profile demo up -d tunel
    #   docker compose logs tunel | grep trycloudflare.com    ← el link
    # El link CAMBIA cada vez que este contenedor reinicia (p. ej. al reiniciar la laptop). Para un link fijo
    # hace falta una cuenta gratuita (Cloudflare con dominio, ngrok o Tailscale Funnel).
    image: cloudflare/cloudflared:2026.10.0
    container_name: rag_tunel
    command: tunnel --no-autoupdate --url http://proxy:80
    depends_on:
      - proxy
    networks:
      - rag_internal
    mem_limit: 128m
    restart: unless-stopped
    profiles: ["demo"]

  proxy:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: rag_proxy
    depends_on:
      - backend
    ports:
      - "8080:80"
    networks:
      - rag_internal
    mem_limit: 256m
    restart: unless-stopped
